<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Jeu de Memory</title>
    <link rel="stylesheet" href="css/style.css" />
</head>
<body>

<!-- ── En-tête ── -->
<header class="header">
    <h1>Jeu de Memory</h1>

    <button id="btn-theme" class="btn-theme">
        <!-- Lune (Feather Icons — croissant plein) -->
        <svg id="icon-moon" xmlns="http://www.w3.org/2000/svg" width="20" height="20"
             fill="currentColor" viewBox="0 0 24 24">
            <path d="M21 12.79A9 9 0 1 1 11.21 3a7 7 0 0 0 9.79 9.79z"/>
        </svg>
        <!-- Soleil (Bootstrap Icons) -->
        <svg id="icon-sun" xmlns="http://www.w3.org/2000/svg" width="20" height="20"
             fill="currentColor" viewBox="0 0 16 16">
            <path d="M8 11a3 3 0 1 1 0-6 3 3 0 0 1 0 6zm0 1a4 4 0 1 0 0-8 4 4 0 0 0 0 8zM8 0a.5.5 0 0 1 .5.5v2a.5.5 0 0 1-1 0v-2A.5.5 0 0 1 8 0zm0 13a.5.5 0 0 1 .5.5v2a.5.5 0 0 1-1 0v-2A.5.5 0 0 1 8 13zm8-5a.5.5 0 0 1-.5.5h-2a.5.5 0 0 1 0-1h2a.5.5 0 0 1 .5.5zM3 8a.5.5 0 0 1-.5.5h-2a.5.5 0 0 1 0-1h2A.5.5 0 0 1 3 8zm10.657-5.657a.5.5 0 0 1 0 .707l-1.414 1.415a.5.5 0 1 1-.707-.708l1.414-1.414a.5.5 0 0 1 .707 0zm-9.193 9.193a.5.5 0 0 1 0 .707L3.05 13.657a.5.5 0 0 1-.707-.707l1.414-1.414a.5.5 0 0 1 .707 0zm9.193 2.121a.5.5 0 0 1-.707 0l-1.414-1.414a.5.5 0 0 1 .707-.707l1.414 1.414a.5.5 0 0 1 0 .707zM4.464 4.465a.5.5 0 0 1-.707 0L2.343 3.05a.5.5 0 1 1 .707-.707l1.414 1.414a.5.5 0 0 1 0 .707z"/>
        </svg>
    </button>
</header>

<!-- ── Formulaire de démarrage ── -->
<section class="setup-form" id="setupPanel">
    <h2>Démarrer une nouvelle partie :</h2>
    <form class="game-form" id="gameForm">

        <div>
            <label for="PlayerName">Pseudo</label>
            <input type="text" id="PlayerName" name="pseudo"
                   placeholder="Votre pseudo…" required minlength="2" maxlength="50"/>
        </div>

        <div>
            <label for="DifficultyValue">Niveau de difficulté</label>
            <select id="DifficultyValue" name="difficulty" required>
                <option value="" disabled selected>Choisir…</option>
                <option value="1">Facile — 8 cartes (4 paires)</option>
                <option value="2">Moyen — 16 cartes (8 paires)</option>
                <option value="3">Difficile — 20 cartes (10 paires)</option>
            </select>
        </div>

        <div>
            <label for="ImageValue">Collection d'images</label>
            <select id="ImageValue" name="theme" required>
                <option value="" disabled selected>Choisir…</option>
                <option value="animals">Animaux 🐾</option>
                <option value="cars">Voitures 🚗</option>
                <option value="fruits">Fruits 🍎</option>
            </select>
        </div>

        <div class="hardcore-container">
            <input type="checkbox" id="HardcoreMode" class="hardcore-checkbox">
            <label for="HardcoreMode" class="hardcore-label">Mode Hardcore 🔥</label>
        </div>

        <div class="fugace-container">
            <input type="checkbox" id="FugaceMode" class="fugace-checkbox">
            <label for="FugaceMode" class="fugace-label">Mode Fugace 👁️</label>
        </div>

        <div class="btn-container">
            <button type="submit" class="btn-start" id="startButton">▶ Démarrer</button>
        </div>

    </form>
</section>

<!-- ── Zone de jeu ── -->
<section class="game-area hidden" id="gamePanel">

    <div class="game-area-header">
        <h2 id="playerLabel">Joueur</h2>
        <span class="game-timer" id="gameTimer">00:00</span>
        <span class="pairs-counter" id="pairsCounter">Paires : 0 / 0</span>
        <!-- Bouton Pause -->
        <button id="pauseButton" class="btn-pause">⏸ Pause</button>
        <button id="abandon">⛔ Abandonner</button>
    </div>

    <!-- Zone du plateau + overlay de pause superposé -->
    <div class="game-board-wrapper">
        <div class="game-board" id="gameBoard"></div>

        <!-- Overlay affiché par-dessus les cartes pendant la pause -->
        <div class="pause-overlay hidden" id="pauseOverlay">
            <div class="pause-overlay-content">
                <span class="pause-icon">⏸</span>
                <p>Partie en pause</p>
                <p class="pause-hint">Cliquez sur "Reprendre" pour continuer</p>
            </div>
        </div>
        <div class="fugace-overlay hidden" id="fugaceOverlay">
            <div class="fugace-overlay-content">
                <p class="fugace-countdown" id="fugaceCountdown">3</p>
                <p class="fugace-hint">Mémorisez les cartes !</p>
            </div>
        </div>
    </div>

</section>

<!-- ── Modale de fin de partie ── -->
<div class="modal-overlay hidden" id="endModal">
    <div class="modal-box">
        <div class="modal-icon" id="modalIcon">🎉</div>
        <h2 class="modal-title" id="modalTitle">Partie terminée !</h2>
        <p class="modal-body" id="modalBody"></p>
        <button class="btn-start" id="modalRestart">↺ Rejouer</button>
    </div>
</div>

<script type="module" src="js/app.js"></script>
</body>
</html>
